<!doctype html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Arda Atik — Artificial Intelligence Engineer portfolio.">
  <meta name="theme-color" content="#000000">

  <title>Arda Atik | Artificial Intelligence Engineer</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="assets/site.webmanifest">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body data-root="." data-page="home">

  <!-- Ambient Background -->
  <div class="ambient-background" aria-hidden="true">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>
    <div class="ambient ambient-four"></div>
  </div>

  <!-- Header -->
  <header id="site-header"></header>

  <main>

    <!-- Hero -->
    <section class="shell hero">

      <div class="hero-content">

        <p class="eyebrow" data-i18n="hero_label"></p>

        <h1>
          <span
            style="display:inline;color:#f5f5f5"
            data-i18n="hero_title"
          ></span>

          <span data-i18n="hero_title_muted"></span>
        </h1>

        <p class="lead" data-i18n="hero_desc"></p>

        <div class="actions">

          <a
            class="button primary"
            href="pages/projects.html"
            data-i18n="explore"
          ></a>

          <a
            class="button"
            href="pages/about.html"
            data-i18n="who_am_i"
          ></a>

          <a
            class="button"
            href="https://github.com/ardaatikk"
            target="_blank"
            rel="noopener"
            data-i18n="github"
          ></a>

        </div>

      </div>

      <div class="hero-tags">
        <span class="tech-tag">Python</span>
        <span class="tech-tag">PyTorch</span>
        <span class="tech-tag">Machine Learning</span>
        <span class="tech-tag">Computer Vision</span>
        <span class="tech-tag">Data</span>
      </div>

    </section>

    <!-- 01 - About -->
    <section class="shell home-section home-about">

    <p class="section-number">01</p>

    <h2 class="section-title" data-i18n="about"></h2>

    <p class="section-copy" data-i18n="about_short"></p>

    <a
        class="section-link"
        href="pages/about.html"
        data-i18n="read_more"
    ></a>

    </section>

    <!-- 02 - Experience -->
    <section class="shell home-section home-experience">

    <p class="section-number">02</p>

    <h2 class="section-title" data-i18n="experience"></h2>

    <p class="section-copy" data-i18n="experience_short"></p>

    <div class="home-timeline">

        <div class="home-timeline-item">
        <span class="home-timeline-date" data-i18n="faydam_period"></span>

        <div class="home-timeline-content">
            <h3 data-i18n="faydam_role"></h3>
            <p data-i18n="faydam_company"></p>
        </div>
        </div>

        <div class="home-timeline-item">
        <span class="home-timeline-date">2024 — 2025</span>

        <div class="home-timeline-content">
            <h3 data-i18n="sisecam_role"></h3>
            <p data-i18n="sisecam_company"></p>
        </div>
        </div>

    </div>

    <a
        class="section-link"
        href="pages/experience.html"
        data-i18n="view_experience"
    ></a>

    </section>

    <!-- 03 - Featured Projects -->
    <section class="shell home-section">

      <p class="section-number">03</p>

      <h2 class="section-title" data-i18n="selected_work"></h2>

      <div
        id="featured-projects"
        class="project-grid"
      ></div>

      <a
        class="section-link"
        href="pages/projects.html"
        data-i18n="view_all"
      ></a>

    </section>

    <!-- 04 - Technical Expertise -->
    <section class="shell home-section">

      <p class="section-number">04</p>

      <h2
        class="section-title"
        data-i18n="technologies"
      ></h2>

      <div class="expertise-grid">

        <!-- Machine Learning -->
        <div class="expertise-card">

          <h3 data-i18n="expertise_ml"></h3>

          <div class="skill-cloud">
            <span class="tech-tag">PyTorch</span>
            <span class="tech-tag">Scikit-learn</span>
            <span class="tech-tag">ResNet</span>
          </div>

        </div>

        <!-- Computer Vision -->
        <div class="expertise-card">

          <h3 data-i18n="expertise_cv"></h3>

          <div class="skill-cloud">
            <span class="tech-tag">OpenCV</span>
            <span class="tech-tag">YOLO</span>
            <span class="tech-tag">MediaPipe</span>
          </div>

        </div>

        <!-- Explainable AI -->
        <div class="expertise-card">

          <h3 data-i18n="expertise_xai"></h3>

          <div class="skill-cloud">
            <span class="tech-tag">Grad-CAM</span>
            <span class="tech-tag">Integrated Gradients</span>
            <span class="tech-tag">Captum</span>
          </div>

        </div>

        <!-- Data Science -->
        <div class="expertise-card">

          <h3 data-i18n="expertise_data"></h3>

          <div class="skill-cloud">
            <span class="tech-tag">Pandas</span>
            <span class="tech-tag">NumPy</span>
            <span class="tech-tag">SQL</span>
          </div>

        </div>

        <!-- Backend & MLOps -->
        <div class="expertise-card">

          <h3 data-i18n="expertise_backend"></h3>

          <div class="skill-cloud">
            <span class="tech-tag">FastAPI</span>
            <span class="tech-tag">Docker</span>
            <span class="tech-tag">GitHub Actions</span>
          </div>

        </div>

      </div>

      <a
        class="section-link"
        href="pages/skills.html"
        data-i18n="view_skills"
      ></a>

    </section>

    <!-- 05 - Contact -->
    <section class="shell home-section">

      <p class="section-number">05</p>

      <h2 class="section-title" data-i18n="contact"></h2>

      <p class="section-copy" data-i18n="contact_short"></p>

      <a
        class="section-link"
        href="pages/contact.html"
        data-i18n="contact_me"
      ></a>

    </section>

  </main>

  <!-- Footer -->
  <footer id="site-footer"></footer>

  <!-- Back to Top -->
  <button id="back-to-top"></button>

  <!-- Scripts -->
  <script src="data/projects.js"></script>
  <script src="data/translations.js"></script>
  <script src="script.js"></script>

</body>
</html>
