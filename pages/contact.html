<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Arda Atik</title>

  <!-- Favicon -->
  <link rel="icon" href="../assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <link rel="manifest" href="../assets/site.webmanifest">
  <meta name="theme-color" content="#000000">

  <!-- Styles -->
  <link rel="stylesheet" href="../style.css">
</head>

<body data-root=".." data-page="contact">

  <!-- Ambient Background -->
  <div class="ambient-background" aria-hidden="true">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>
    <div class="ambient ambient-four"></div>
  </div>

  <!-- Header -->
  <header id="site-header"></header>

  <!-- Main Content -->
  <main class="shell page">

    <!-- Back to Home -->
    <a
      class="back-link"
      href="../index.html"
      data-i18n="back_home"
    ></a>

    <!-- Page Heading -->
    <p class="eyebrow" data-i18n="contact"></p>

    <h1
      class="page-title"
      data-i18n="contact_title"
    ></h1>

    <p
      class="page-intro"
      data-i18n="contact_intro"
    ></p>

    <!-- Contact Panel -->
    <div class="contact-panel">

      <div class="contact-methods">

        <!-- Phone -->
        <a
          class="contact-method"
          href="tel:+905309417169"
        >
          <span
            class="contact-method-label"
            data-i18n="phone"
          ></span>

          <span class="contact-method-value">
            +90 530 941 7169
          </span>
        </a>

        <!-- Email -->
        <a
          class="contact-method"
          href="mailto:ardacematik@gmail.com"
        >
          <span
            class="contact-method-label"
            data-i18n="email"
          ></span>

          <span class="contact-method-value">
            ardacematik@gmail.com
          </span>
        </a>

        <!-- GitHub -->
        <a
          class="contact-method"
          href="https://github.com/ardaatikk"
          target="_blank"
          rel="noopener"
        >
          <span class="contact-method-label">
            GitHub
          </span>

          <span class="contact-method-value">
            @ardaatikk ↗
          </span>
        </a>

        <!-- LinkedIn -->
        <a
          class="contact-method"
          href="https://www.linkedin.com/in/arda-atik/"
          target="_blank"
          rel="noopener"
        >
          <span class="contact-method-label">
            LinkedIn
          </span>

          <span class="contact-method-value">
            Arda Atik ↗
          </span>
        </a>

      </div>

    </div>

    <!-- Page End -->
    <div class="page-end">

      <a
        class="back-link"
        style="margin:0"
        href="../index.html"
        data-i18n="back_home"
      ></a>

      <span data-i18n="page_end"></span>

    </div>

  </main>

  <!-- Footer -->
  <footer id="site-footer"></footer>

  <!-- Back to Top -->
  <button id="back-to-top"></button>

  <!-- Scripts -->
  <script src="../data/projects.js"></script>
  <script src="../data/translations.js"></script>
  <script src="../script.js"></script>

</body>
</html>
