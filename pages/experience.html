<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Arda Atik</title>

  <!-- Favicon -->
  <link rel="icon" href="../assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <link rel="manifest" href="../assets/site.webmanifest">
  <meta name="theme-color" content="#000000">

  <!-- Styles -->
  <link rel="stylesheet" href="../style.css">
</head>

<body data-root=".." data-page="experience">

  <!-- Ambient Background -->
  <div class="ambient-background" aria-hidden="true">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>
    <div class="ambient ambient-four"></div>
  </div>

  <!-- Header -->
  <header id="site-header"></header>

  <!-- Main Content -->
  <main class="shell page">

    <!-- Back to Home -->
    <a
      class="back-link"
      href="../index.html"
      data-i18n="back_home"
    ></a>

    <!-- Page Heading -->
    <p class="eyebrow" data-i18n="experience"></p>

    <h1
      class="page-title"
      data-i18n="experience_title"
    ></h1>

    <!-- Experience List -->
    <div class="experience-list">

      <!-- Faydam Innovation -->
      <article class="experience-item">

        <div class="experience-meta">
          <span data-i18n="faydam_period"></span>
          <span data-i18n="eskisehir"></span>
        </div>

        <div class="experience-content">

          <h2 data-i18n="faydam_role"></h2>

          <p
            class="company"
            data-i18n="faydam_company_full"
          ></p>

          <p data-i18n="faydam_desc"></p>

          <div class="tags">
            <span class="tech-tag">Python</span>
            <span class="tech-tag">Pandas</span>
            <span class="tech-tag">PyTorch</span>
            <span class="tech-tag">YOLO</span>
            <span class="tech-tag">SciPy</span>
          </div>

        </div>

      </article>

      <!-- Sisecam -->
      <article class="experience-item">

        <div class="experience-meta">
          <span data-i18n="sisecam_period"></span>
          <span data-i18n="turkey"></span>
        </div>

        <div class="experience-content">

          <h2 data-i18n="sisecam_role"></h2>

          <p
            class="company"
            data-i18n="sisecam_company_full"
          ></p>

          <p data-i18n="sisecam_desc"></p>

          <div class="tags">
            <span class="tech-tag">Python</span>
            <span class="tech-tag">SQL</span>
            <span class="tech-tag">Power Query</span>
            <span class="tech-tag">Excel</span>
          </div>

        </div>

      </article>

    </div>

    <!-- Page End -->
    <div class="page-end">

      <a
        class="back-link"
        style="margin:0"
        href="../index.html"
        data-i18n="back_home"
      ></a>

      <span data-i18n="page_end"></span>

    </div>

  </main>

  <!-- Footer -->
  <footer id="site-footer"></footer>

  <!-- Back to Top -->
  <button id="back-to-top"></button>

  <!-- Scripts -->
  <script src="../data/projects.js"></script>
  <script src="../data/translations.js"></script>
  <script src="../script.js"></script>

</body>
</html>
